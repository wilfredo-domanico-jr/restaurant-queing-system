name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore back-end/back-end.sln
      - run: dotnet build back-end/back-end.sln --configuration Release --no-restore
      - run: dotnet test back-end/back-end.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back-end
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5272/api
            NEXT_PUBLIC_API_KEY=ci-placeholder-key
