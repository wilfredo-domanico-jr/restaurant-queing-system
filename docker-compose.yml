services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=RestaurantQueing;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ApiKey: ${API_KEY}
      Jwt__Secret: ${JWT_SECRET}
      Admin__Username: ${ADMIN_USERNAME}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH}
      AllowedOrigins__0: "http://localhost:3000"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5272:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5272/api"
        NEXT_PUBLIC_API_KEY: ${API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
